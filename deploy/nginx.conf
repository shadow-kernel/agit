# nginx reverse proxy for agit-server with TLS.
#
#   sudo install -m 0644 deploy/nginx.conf /etc/nginx/sites-available/agit
#   sudo ln -s /etc/nginx/sites-available/agit /etc/nginx/sites-enabled/agit
#   sudo certbot --nginx -d agit.example.com      # obtains the certificate and
#                                                 # fills in the ssl_* paths
#   sudo nginx -t && sudo systemctl reload nginx
#
# agit-server listens on 127.0.0.1:7878 (AGIT_LISTEN).

upstream agit_server {
    server 127.0.0.1:7878;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name agit.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name agit.example.com;

    ssl_certificate     /etc/letsencrypt/live/agit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:agit_ssl:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Object uploads (push) can be large; 0 disables the limit. Set a cap
    # that fits your repositories if the server is reachable by untrusted
    # clients.
    client_max_body_size 0;

    access_log /var/log/nginx/agit.access.log;
    error_log  /var/log/nginx/agit.error.log;

    # Server-sent events: no buffering, no timeouts that cut the stream.
    location ~ ^/api/v1/repos/[^/]+/events/stream$ {
        proxy_pass http://agit_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # API and the web UI served by agit-server (--web-dir).
    location / {
        proxy_pass http://agit_server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;   # stream pushes through instead of spooling to disk
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
