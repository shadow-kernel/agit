# Checks that the handbook (docs/, mdBook) still builds. Nothing is
# published from this repository: the website lives in shadow-kernel/agit-site
# at https://shadow-kernel.github.io/agit-site/.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build handbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - run: mdbook build docs
